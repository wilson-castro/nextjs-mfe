<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 775" width="780" height="775" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Arquitetura do front-end com BFF: responsabilidades e serviços internos</title>
<desc id="descricao">Agentes externos no topo: dois navegadores e CDN. No centro, o front-end Next.js contém o Site SPA que executa no navegador e o BFF que executa no servidor. O BFF agrupa autenticação, cache, composição de dados e tempo real, atravessado horizontalmente por duas faixas transversais: autorização e isolamento de servidor. Uma faixa vertical de observabilidade percorre Site e BFF. Na base, serviços externos: provedor SSO, Redis, API Spring Boot e coletor OTel.</desc>
<style>
svg{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root{
--gf:#F1EFE8;--gs:#5F5E5A;--gt:#2C2C2A;--gm:#5F5E5A;
--pf:#EEEDFE;--ps:#534AB7;--pt:#26215C;--pm:#534AB7;
--tf:#E1F5EE;--ts:#0F6E56;--tt:#04342C;--tm:#0F6E56;
--cf:#FAECE7;--cs:#993C1D;--ct:#4A1B0C;--cm:#993C1D;
--arr:#888780;--arrt:#5F5E5A;
}
@media (prefers-color-scheme:dark){:root{
--gf:#444441;--gs:#B4B2A9;--gt:#D3D1C7;--gm:#B4B2A9;
--pf:#3C3489;--ps:#AFA9EC;--pt:#CECBF6;--pm:#AFA9EC;
--tf:#085041;--ts:#5DCAA5;--tt:#9FE1CB;--tm:#5DCAA5;
--cf:#712B13;--cs:#F0997B;--ct:#F5C4B3;--cm:#F0997B;
--arr:#888780;--arrt:#B4B2A9;
}}
.gray rect{fill:var(--gf);stroke:var(--gs);stroke-width:.5}
.gray .th{fill:var(--gt)}.gray .ts{fill:var(--gm)}
.purple rect{fill:var(--pf);stroke:var(--ps);stroke-width:.5}
.purple .th{fill:var(--pt)}.purple .ts{fill:var(--pm)}
.teal rect{fill:var(--tf);stroke:var(--ts);stroke-width:.5}
.teal .th{fill:var(--tt)}.teal .ts{fill:var(--tm)}
.coral rect{fill:var(--cf);stroke:var(--cs);stroke-width:.5}
.coral .th{fill:var(--ct)}.coral .ts{fill:var(--cm)}
rect.hollow{fill:none}
.th{font-size:14px;font-weight:500}
.ts{font-size:12px;font-weight:400}
.arr{stroke:var(--arr);stroke-width:1.4;fill:none}
.lbl{font-size:12px;fill:var(--arrt)}
#seta path{stroke:var(--arr);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
