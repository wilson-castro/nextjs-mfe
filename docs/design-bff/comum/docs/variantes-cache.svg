<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 968" width="840" height="968" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Comparação das variantes X (sem cache) e Y (com cache) no BFF</title>
<desc id="d">Duas colunas lado a lado. A esquerda mostra a variante X, sem camada de cache, com cinco passos de leitura, três requisitos e quatro consequências. A direita mostra a variante Y, com cache, com sete passos de leitura, seis requisitos e quatro consequências. A assimetria na seção de requisitos é o ponto central da comparação.</desc>
<style>
svg{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root{
--gf:#F1EFE8;--gs:#5F5E5A;--gt:#2C2C2A;--gm:#5F5E5A;
--tf:#E1F5EE;--ts:#0F6E56;--tt:#04342C;--tm:#0F6E56;
--cf:#FAECE7;--cs:#993C1D;--ct:#4A1B0C;--cm:#993C1D;
--arr:#888780;--arrt:#5F5E5A;}
@media (prefers-color-scheme:dark){:root{
--gf:#444441;--gs:#B4B2A9;--gt:#D3D1C7;--gm:#B4B2A9;
--tf:#085041;--ts:#5DCAA5;--tt:#9FE1CB;--tm:#5DCAA5;
--cf:#712B13;--cs:#F0997B;--ct:#F5C4B3;--cm:#F0997B;
--arr:#888780;--arrt:#B4B2A9;}}
.gray rect{fill:var(--gf);stroke:var(--gs);stroke-width:.5}
.gray .th{fill:var(--gt)}.gray .ts{fill:var(--gm)}
.teal rect{fill:var(--tf);stroke:var(--ts);stroke-width:.5}
.teal .th{fill:var(--tt)}.teal .ts{fill:var(--tm)}
.coral rect{fill:var(--cf);stroke:var(--cs);stroke-width:.5}
.coral .th{fill:var(--ct)}.coral .ts{fill:var(--cm)}
rect.hollow{fill:none}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.num{font-size:11px;font-weight:600;opacity:.65}
.arr{stroke:var(--arr);stroke-width:1.4;fill:none}
#s path{stroke:var(--arr);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs><marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9"/></marker></defs>

<g class="teal">
<rect x="16" y="12" width="394" height="54" rx="8"/>
<text class="th" x="213" y="32" text-anchor="middle" dominant-baseline="central">Variante X — sem camada de cache</text>
<text class="ts" x="213" y="50" text-anchor="middle" dominant-baseline="central">vigente · ADR-0007</text>
</g>
<g class="coral">
<rect x="430" y="12" width="394" height="54" rx="8"/>
<text class="th" x="627" y="32" text-anchor="middle" dominant-baseline="central">Variante Y — com camada de cache</text>
<text class="ts" x="627" y="50" text-anchor="middle" dominant-baseline="central">supersedida · ADR-0003</text>
</g>

<g class="gray">
<rect class="hollow" x="16" y="82" width="808" height="466" rx="10"/>
<text class="ts" x="28" y="98" dominant-baseline="central">caminho de uma leitura de /pedidos/8821</text>
</g>

<g class="teal">
<rect x="48" y="112" width="330" height="42" rx="6"/>
<text class="num" x="60" y="126" dominant-baseline="central">1</text>
<text class="th" x="213" y="127" text-anchor="middle" dominant-baseline="central">Server Component</text>
<text class="ts" x="213" y="143" text-anchor="middle" dominant-baseline="central">getPedido('8821')</text>
<rect x="48" y="170" width="330" height="42" rx="6"/>
<text class="num" x="60" y="184" dominant-baseline="central">2</text>
<text class="th" x="213" y="185" text-anchor="middle" dominant-baseline="central">DAL · cache() do React</text>
<text class="ts" x="213" y="201" text-anchor="middle" dominant-baseline="central">dedup dentro da renderização, sem chave</text>
<rect x="48" y="228" width="330" height="42" rx="6"/>
<text class="num" x="60" y="242" dominant-baseline="central">3</text>
<text class="th" x="213" y="243" text-anchor="middle" dominant-baseline="central">requireSessao()</text>
<text class="ts" x="213" y="259" text-anchor="middle" dominant-baseline="central">Redis · apenas sessão</text>
<rect x="48" y="286" width="330" height="42" rx="6"/>
<text class="num" x="60" y="300" dominant-baseline="central">4</text>
<text class="th" x="213" y="301" text-anchor="middle" dominant-baseline="central">upstream/client</text>
<text class="ts" x="213" y="317" text-anchor="middle" dominant-baseline="central">Bearer · timeout · allowlist de destino</text>
<rect x="48" y="344" width="330" height="42" rx="6"/>
<text class="num" x="60" y="358" dominant-baseline="central">5</text>
<text class="th" x="213" y="359" text-anchor="middle" dominant-baseline="central">Domínio</text>
<text class="ts" x="213" y="375" text-anchor="middle" dominant-baseline="central">projeta e calcula _permissoes · sempre 200</text>
</g>
<line class="arr" x1="213" y1="154" x2="213" y2="164" marker-end="url(#s)"/>
<line class="arr" x1="213" y1="212" x2="213" y2="222" marker-end="url(#s)"/>
<line class="arr" x1="213" y1="270" x2="213" y2="280" marker-end="url(#s)"/>
<line class="arr" x1="213" y1="328" x2="213" y2="338" marker-end="url(#s)"/>

<g class="coral">
<rect x="462" y="112" width="330" height="42" rx="6"/>
<text class="num" x="474" y="126" dominant-baseline="central">1</text>
<text class="th" x="627" y="127" text-anchor="middle" dominant-baseline="central">Server Component</text>
<text class="ts" x="627" y="143" text-anchor="middle" dominant-baseline="central">getPedido('8821')</text>
<rect x="462" y="170" width="330" height="42" rx="6"/>
<text class="num" x="474" y="184" dominant-baseline="central">2</text>
<text class="th" x="627" y="185" text-anchor="middle" dominant-baseline="central">requireSessao()</text>
<text class="ts" x="627" y="201" text-anchor="middle" dominant-baseline="central">Redis (sessão) · deriva o scopeKey</text>
<rect x="462" y="228" width="330" height="42" rx="6"/>
<text class="num" x="474" y="242" dominant-baseline="central">3</text>
<text class="th" x="627" y="243" text-anchor="middle" dominant-baseline="central">DAL monta a chave</text>
<text class="ts" x="627" y="259" text-anchor="middle" dominant-baseline="central">pedido:8821:{scopeKey}</text>
<rect x="462" y="286" width="330" height="42" rx="6"/>
<text class="num" x="474" y="300" dominant-baseline="central">4</text>
<text class="th" x="627" y="301" text-anchor="middle" dominant-baseline="central">Redis (cache)</text>
<text class="ts" x="627" y="317" text-anchor="middle" dominant-baseline="central">fresco → devolve · stale → segue · ausente → segue</text>
<rect x="462" y="344" width="330" height="42" rx="6"/>
<text class="num" x="474" y="358" dominant-baseline="central">5</text>
<text class="th" x="627" y="359" text-anchor="middle" dominant-baseline="central">upstream/client</text>
<text class="ts" x="627" y="375" text-anchor="middle" dominant-baseline="central">Bearer + If-None-Match do ETag guardado</text>
<rect x="462" y="402" width="330" height="42" rx="6"/>
<text class="num" x="474" y="416" dominant-baseline="central">6</text>
<text class="th" x="627" y="417" text-anchor="middle" dominant-baseline="central">Domínio</text>
<text class="ts" x="627" y="433" text-anchor="middle" dominant-baseline="central">200 com corpo novo · ou 304 sem corpo</text>
<rect x="462" y="460" width="330" height="42" rx="6"/>
<text class="num" x="474" y="474" dominant-baseline="central">7</text>
<text class="th" x="627" y="475" text-anchor="middle" dominant-baseline="central">Redis (cache) grava</text>
<text class="ts" x="627" y="491" text-anchor="middle" dominant-baseline="central">novo corpo · ou estende o frescor do antigo</text>
</g>
<line class="arr" x1="627" y1="154" x2="627" y2="164" marker-end="url(#s)"/>
<line class="arr" x1="627" y1="212" x2="627" y2="222" marker-end="url(#s)"/>
<line class="arr" x1="627" y1="270" x2="627" y2="280" marker-end="url(#s)"/>
<line class="arr" x1="627" y1="328" x2="627" y2="338" marker-end="url(#s)"/>
<line class="arr" x1="627" y1="386" x2="627" y2="396" marker-end="url(#s)"/>
<line class="arr" x1="627" y1="444" x2="627" y2="454" marker-end="url(#s)"/>

<g class="gray">
<rect class="hollow" x="16" y="566" width="808" height="238" rx="10"/>
<text class="ts" x="28" y="582" dominant-baseline="central">o que a variante exige para estar correta</text>
</g>

<g class="teal">
<rect x="48" y="598" width="330" height="26" rx="4"/>
<text class="ts" x="213" y="611" text-anchor="middle" dominant-baseline="central">uma instância de Redis, só para sessão</text>
<rect x="48" y="630" width="330" height="26" rx="4"/>
<text class="ts" x="213" y="643" text-anchor="middle" dominant-baseline="central">ETag com um único uso: If-Match</text>
<rect x="48" y="662" width="330" height="26" rx="4"/>
<text class="ts" x="213" y="675" text-anchor="middle" dominant-baseline="central">relay do SSE é repasse puro</text>
</g>

<g class="coral">
<rect x="462" y="598" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="611" text-anchor="middle" dominant-baseline="central">duas instâncias de Redis, políticas opostas</text>
<rect x="462" y="630" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="643" text-anchor="middle" dominant-baseline="central">índice de invalidação por recurso</text>
<rect x="462" y="662" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="675" text-anchor="middle" dominant-baseline="central">watermark de geração contra stale set</text>
<rect x="462" y="694" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="707" text-anchor="middle" dominant-baseline="central">projectionKey derivável ANTES do lookup</text>
<rect x="462" y="726" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="739" text-anchor="middle" dominant-baseline="central">validador da representação, separado do If-Match</text>
<rect x="462" y="758" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="771" text-anchor="middle" dominant-baseline="central">invalidação no relay do SSE, antes do repasse</text>
</g>

<g class="gray">
<rect class="hollow" x="16" y="822" width="808" height="132" rx="10"/>
<text class="ts" x="28" y="838" dominant-baseline="central">consequências</text>
<rect x="48" y="854" width="330" height="26" rx="4"/>
<text class="ts" x="213" y="867" text-anchor="middle" dominant-baseline="central">~267 chamadas/s ao domínio · 2.000 usuários</text>
<rect x="48" y="886" width="330" height="26" rx="4"/>
<text class="ts" x="213" y="899" text-anchor="middle" dominant-baseline="central">+16 ms por página (estimativa, não medição)</text>
<rect x="462" y="854" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="867" text-anchor="middle" dominant-baseline="central">~53 chamadas/s ao domínio · 2.000 usuários</text>
<rect x="462" y="886" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="899" text-anchor="middle" dominant-baseline="central">−16 ms por página (estimativa, não medição)</text>
</g>
<g class="teal">
<rect x="48" y="918" width="330" height="26" rx="4"/>
<text class="ts" x="213" y="931" text-anchor="middle" dominant-baseline="central">_permissoes sempre fresco</text>
</g>
<g class="coral">
<rect x="462" y="918" width="330" height="26" rx="4"/>
<text class="ts" x="627" y="931" text-anchor="middle" dominant-baseline="central">_permissoes obsoleto por tempo indefinido</text>
</g>
</svg>
